name: Deploy static site to GitHub Pages

# 站点 = 仓库根目录下的静态文件（无构建步骤）。
# 推送到 main 即发布；也可在 Actions 页手动触发。
#
# ⚠️ 首次使用前必须先在 GitHub 上做一次性设置，否则会报
#    "Resource not accessible by integration"：
#      仓库 Settings → Actions → General → Workflow permissions
#      → 选择 "Read and write permissions" → Save
#    （新仓库默认只读，会把下面 permissions: 里声明的 pages: write 压掉，
#      导致 configure-pages 无法创建 Pages 站点）
#
# 若不想放开权限，可改用「分支发布」，本工作流即可删除：
#      Settings → Pages → Source = Deploy from a branch
#      → Branch = main / (root) → Save

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Stage site (只发布网页文件)
        run: |
          mkdir -p _site
          cp -v *.html *.css .nojekyll _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
