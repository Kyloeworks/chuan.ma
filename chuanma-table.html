<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>川麻实战 · 血战到底 · Chuanma Trainer</title>
<style>
  :root{
    --bg:#e7eaee; --card:#fff; --ink:#1a1d21; --sub:#5b6470; --line:#dfe3e9;
    --accent:#1f6feb; --accent-soft:#eef4fd;
    --wan:#c0392b; --tiao:#1c7d4d; --tong:#2f6fb5;
    --good:#1e8e5a; --goodbg:#eef8f2; --warn:#b7791f; --warnbg:#fdf6e8;
    --gold:#c9971f; --turn:#1f6feb;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh}
  /* 用 min-height 而非 height:100%：预览面板若按内容自适应高度，height:100% 会塌成 0 导致整页空白 */
  .app{min-height:100vh;display:flex;flex-direction:column}

  /* ---------- 顶栏 ---------- */
  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0;white-space:nowrap}
  .hstat{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--sub);flex-wrap:wrap}
  .hstat b{color:var(--ink);font-variant-numeric:tabular-nums}
  .hstat .turnlbl{color:var(--accent);font-weight:800}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 12px;
    font-size:12.5px;cursor:pointer;color:var(--ink);font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.pri:hover{background:#1a5fd0;color:#fff}
  .btn.ghost{font-weight:500;color:var(--sub)}

  /* ---------- 圆桌 ---------- */
  .board{flex:1;min-height:0;display:grid;gap:8px;padding:8px;
    grid-template-areas:". top ." "left center right" "me me me";
    grid-template-columns:minmax(120px,17%) minmax(0,1fr) minmax(120px,17%);
    grid-template-rows:auto minmax(0,1fr) auto}
  .b-top{grid-area:top} .b-left{grid-area:left} .b-center{grid-area:center}
  .b-right{grid-area:right} .b-me{grid-area:me}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
    min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .panel.turn{border-color:var(--turn);box-shadow:0 0 0 2px rgba(31,111,235,.28),0 0 14px rgba(31,111,235,.18)}
  .panel.won{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,151,31,.3)}
  .phead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
  .pname{font-weight:800;font-size:13.5px}
  .ptag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:#eef1f5;color:var(--sub);white-space:nowrap}
  .ptag.miss{background:var(--warnbg);color:var(--warn)}
  .ptag.won{background:#fbf3df;color:var(--gold)}
  .ptag.turn{background:var(--accent-soft);color:var(--accent)}
  .ptag.dir{background:#e8f5ee;color:var(--good)}
  .rowlbl{font-size:10.5px;color:var(--sub);margin:5px 0 3px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .tiles{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;min-height:0}
  .tile{width:26px;height:36px;line-height:0;position:relative;flex:none;user-select:none;border-radius:6px}
  .tile svg{display:block;width:100%;height:100%}
  .tile.sm{width:18px;height:25px;border-radius:4px}
  .tile.xs{width:20px;height:28px;border-radius:5px}
  .tile.click{cursor:pointer;transition:.1s}
  .tile.click:hover{transform:translateY(-4px);box-shadow:0 5px 12px rgba(0,0,0,.16)}
  .tile.dim{opacity:.28;cursor:not-allowed}
  .tile.rec{border-radius:7px;box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(201,151,31,.55)}
  .tile.rec::after{content:'推荐';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:9px;
    background:var(--gold);color:#fff;padding:0 4px;border-radius:4px;font-weight:700;line-height:13px;white-space:nowrap}
  .tile.wintile{box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(201,151,31,.6);border-radius:7px}
  .river{display:flex;flex-direction:column;gap:2px;min-height:0}
  .river-row{display:flex;gap:2px;justify-content:center}
  .handsep{flex:none;width:12px;align-self:stretch}
  .tile.justdrawn,.tile.wintile{box-shadow:0 0 0 2px var(--gold)}
  .melds{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
  .meld{display:flex;gap:1px;padding:1px;border:1px dashed var(--line);border-radius:5px}

  /* 中央 */
  .b-center{align-items:center;justify-content:center;text-align:center;gap:6px}
  .wallbig{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .wallcap{font-size:11px;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  .turnrow{font-size:17px;font-weight:900;color:var(--accent)}
  .orderline{font-size:12.5px;color:var(--sub);display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
  .orderline .chip{padding:1px 8px;border-radius:20px;background:#eef1f5;font-weight:700;color:#48505b}
  .orderline .chip.you{background:var(--accent-soft);color:var(--accent)}
  .orderline .chip.next{background:#e8f5ee;color:var(--good)}
  .orderline .chip.prev{background:#fdf6e8;color:var(--warn)}
  .lastrow{font-size:12.5px;color:var(--sub)}
  .lastrow .tile{display:inline-block;vertical-align:middle;margin-left:5px}

  /* 我的区 */
  .b-me{gap:4px}
  .handrow{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:14px 0 6px;min-height:78px}
  .handrow .tile{width:46px;height:64px;border-radius:9px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:0;align-items:center;padding-bottom:2px}
  .act{border:none;border-radius:10px;padding:9px 24px;font-size:15px;font-weight:800;cursor:pointer;
    color:#fff;background:var(--accent);letter-spacing:.05em}
  .act.hu{background:var(--wan)} .act.pong{background:var(--tiao)} .act.kong{background:var(--tong)}
  .act.pass{background:#8a94a0}
  .act:hover{filter:brightness(1.08)}
  .hintbar{font-size:12.5px;color:var(--sub);text-align:center;min-height:18px}
  .metarow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--sub)}
  .metarow b{color:var(--ink);font-variant-numeric:tabular-nums}
  .teach{margin:8px auto 0;max-width:640px;background:#f4f8f6;border:1px solid #cfe3d8;border-radius:12px;padding:8px 12px;text-align:center}
  .teach .tbig{font-size:15px;font-weight:800;color:var(--ink)}
  .teach .tbig.ok{color:#0f6e56}
  .teach .tbig.warn{color:#ba7517}
  .teach .tbig.win{color:var(--gold)}
  .teach .twait{font-size:12.5px;color:#0f6e56;font-weight:700;margin-top:3px}
  .teach .treason{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:3px}
  .diffs{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
  .dbtn{border:1px solid var(--line);background:#fff;color:var(--sub);font-size:12px;padding:3px 9px;border-radius:12px;cursor:pointer;font-weight:600}
  .dbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dbtn.on[data-d=easy]{background:#0f6e56;border-color:#0f6e56}
  .dbtn.on[data-d=hard]{background:#a32d2d;border-color:#a32d2d}
  .res-table tr.me td{background:#f6f9ff}
  .res-table tr.me td:first-child{font-weight:800}

  /* ---------- 底部记录 ---------- */
  .bottom{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:6px 14px;
    display:flex;gap:12px;align-items:flex-start;max-height:82px}
  .bottom .logcap{font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.06em;
    text-transform:uppercase;padding-top:3px;white-space:nowrap}
  .log{flex:1;overflow-y:auto;font-size:12.5px;max-height:70px}
  .log div{padding:1px 0}
  .log .n{color:var(--sub);font-family:var(--mono);font-size:11px;margin-right:6px}

  /* ---------- 覆盖层（定缺 / 结算 / 帮助） ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,26,34,.5);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:20}
  .overlay.show{display:flex}
  .modal{background:var(--card);border-radius:16px;padding:22px 24px;max-width:760px;width:100%;
    max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{font-size:18px;margin:0 0 6px}
  .modal .lead{color:var(--sub);font-size:13.5px;margin:0 0 14px}
  .miss-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .mp{border:2px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;background:#fff;transition:.12s}
  .mp:hover{border-color:var(--accent);transform:translateY(-2px)}
  .mp .big{font-size:28px;font-weight:900}
  .mp .cnt{font-size:13px;color:var(--sub);margin-top:4px}
  .mp .recs{font-size:11.5px;font-weight:800;color:var(--gold);margin-top:5px}
  .mp.recommend{border-color:var(--gold);background:#fffdf6}
  .res-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
  .res-table th,.res-table td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
  .res-table th{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
  .fanlist{font-size:12.5px;color:var(--sub)}
  .legendbox{font-size:13px;color:#3a4149;line-height:1.9}
  @media(max-width:900px){
    .board{grid-template-columns:minmax(92px,15%) minmax(0,1fr) minmax(92px,15%)}
    .handrow .tile{width:38px;height:53px}
  }
</style>
</head>

</div>

      }
      // 教学条（A）：向听进度 / 听牌提示 —— 手牌 14 张时按「打完推荐牌」判断
      h += '<div class="teach" id="teach">';
      if (p.won) {
        h += '<div class="tbig win">🎉 ' + t().youWon + ' · ' + (p.winInfo ? p.winInfo.fans.total : 0) + ' 番</div>';
      } else if (mustMiss) {
        h += '<div class="tbig warn">⚠ ' + t().teachMustMiss + '</div>';
      } else {
        var probe = myT && total === need + 1 && rec2 >= 0;
        var wt = [], left = 0, shAfter = sh;
        if (total === need || probe) {
          if (probe) p.hand[rec2]--;
          shAfter = CM.shanten(p.hand, p.melds.length);
          if (shAfter <= 0) wt = CM.winningTiles(p.hand, p.melds.length).filter(function (x) { return !(p.missing >= 0 && Math.floor(x / 9) === p.missing); });
          if (probe) p.hand[rec2]++;
        }
        wt.forEach(function (x) { left += Math.max(0, 4 - p.hand[x]); });
        if (wt.length) {
          h += '<div class="tbig ok">' + t().teachReady + ' · ' + t().teachWait(left) + '</div>';
          h += '<div class="twait">' + t().teachWaiting + wt.map(function (x) { return CM.tileLabel(x) + '(' + Math.max(0, 4 - p.hand[x]) + ')'; }).join(' ') + '</div>';
        } else {
          h += '<div class="tbig">' + t().teachShanten(shAfter) + (sh > 0 ? ' · ' + t().teachImprove(CM.improvingTiles(p.hand, p.melds.length).length) : '') + '</div>';
        }
      }
      if (rec2 >= 0) h += '<div class="treason">★ ' + t().teachReason(CM.tileLabel(rec2), recCnt) + '</div>';
      h += '</div>';
      h += '<div class="hintbar" id="hint"></div><div class="actions" id="actions"></div>';
    }
    return '<div class="' + cls + '">' + h + '</div>';
  }

  function centerHTML() {
    var g = state.g;
    var chips = [0, 1, 2, 3].map(function (seat) {
      var c = 'chip' + (seat === 0 ? ' you' : (seat === 1 ? ' next' : (seat === 3 ? ' prev' : '')));
      var mark = (g.phase === 'playing' && g.turn === seat) ? ' ●' : '';
      return '<span class="' + c + '">' + seatName(seat) + mark + '</span>';
    }).join('<span>→</span>');
    var h = '';
    if (state.banner) h += '<div class="turnrow" style="color:var(--gold)">' + state.banner.text + '</div>';
    h += '<div class="wallbig">' + g.wall.length + '</div><div class="wallcap">' + t().wall + '</div>';
    if (!state.banner) h += '<div class="turnrow">' + (g.phase === 'playing' ? t().turn + ' ' + seatName(g.turn) : t().settled) + '</div>';
    h += '<div class="orderline" style="margin-top:4px">' + t().orderT + '</div><div class="orderline">' + chips + '</div>';
    if (g.lastDiscard) h += '<div class="lastrow">' + seatName(g.lastDiscard.seat) + ' · ' + tileHTML(g.lastDiscard.tile, { xs: true }) + '</div>';
    return '<div class="panel b-center">' + h + '</div>';
  }

  function renderHand() {
    var g = state.g, my = g.players[HUMAN], el = document.getElementById('hand');
    if (!el) return;
    var myTurn = g.phase === 'playing' && g.turn === HUMAN && !my.won && !g.claim;
    var mustMiss = CM.holdsMissingSuit(my), rec = -1;
    if (myTurn) { try { rec = CM.botDiscardTile(g, HUMAN); } catch (e) { rec = -1; } }
    var html = '';
    // 手牌按序排列；「刚摸到的牌」单独排在右手边，出牌后自动归位
    var drawn = (!my.won && my.lastDrawn >= 0 && my.hand[my.lastDrawn] > 0) ? my.lastDrawn : -1;
    var seq = [];
    for (var q = 0; q < 27; q++) for (var m = 0; m < my.hand[q]; m++) seq.push(q);
    if (drawn >= 0) { var di = seq.indexOf(drawn); if (di >= 0) seq.splice(di, 1); }
    function one(id, extra) {
      var legal = myTurn && (!mustMiss || CM.suitOf(id) === my.missing);
      var cls = legal ? 'click' : (myTurn ? 'dim' : '');
      if (myTurn && id === rec) cls += ' rec';
      if (extra) cls += ' ' + extra;
      return tileHTML(id, { cls: cls, attr: legal ? ' data-tile="' + id + '"' : '' });
    }
    for (var i = 0; i < seq.length; i++) html += one(seq[i]);
    if (drawn >= 0) html += '<span class="handsep"></span>' + one(drawn, 'justdrawn');
    el.innerHTML = html;
    var hint = document.getElementById('hint');
    if (hint) hint.textContent = my.won ? '' : (myTurn ? (mustMiss ? t().mustMiss : t().yourTurn) : (state.demo ? t().demoOn : ''));
    el.querySelectorAll('.tile.click').forEach(function (b) { b.onclick = function () { humanDiscard(+b.dataset.tile); }; });
  }

  function renderActions() {
    var g = state.g, my = g.players[HUMAN], el = document.getElementById('actions');
    if (!el) return;
    var html = '';
    if (g.phase === 'playing' && !my.won) {
      if (g.claim && (g.claim.pong.indexOf(HUMAN) >= 0 || g.claim.kong.indexOf(HUMAN) >= 0)) {
        html += '<span style="font-weight:800;align-self:center">' + t().claimT + '</span>';
        if (g.claim.kong.indexOf(HUMAN) >= 0) html += '<button class="act kong" id="aKong">' + t().kongBtn + '</button>';
        if (g.claim.pong.indexOf(HUMAN) >= 0) html += '<button class="act pong" id="aPong">' + t().pongBtn + '</button>';
        html += '<button class="act pass" id="aPass">' + t().passBtn + '</button>';
      } else if (g.turn === HUMAN && !g.claim) {
        var ck = CM.botConcealedKongTile(g, HUMAN); if (ck >= 0) html += '<button class="act kong" id="aCK">' + t().concealedKong + '</button>';
        var ak = CM.botAddedKongTile(g, HUMAN); if (ak >= 0) html += '<button class="act kong" id="aAK">' + t().addedKong + '</button>';
      }
    }
    el.innerHTML = html;
    var b;
    if ((b = document.getElementById('aKong'))) b.onclick = humanKong;
    if ((b = document.getElementById('aPong'))) b.onclick = humanPong;
    if ((b = document.getElementById('aPass'))) b.onclick = humanPass;
    if ((b = document.getElementById('aCK'))) b.onclick = humanConcealedKong;
    if ((b = document.getElementById('aAK'))) b.onclick = humanAddedKong;
  }

  function declareModal() {
    var g = state.g, my = g.players[HUMAN];
    var cnt = [0, 1, 2].map(function (s) { return CM.suitCount(my.hand, s); });
    var rec = CM.botMissingSuit(g, HUMAN);
    var h = '<div class="modal"><h2>' + t().declareT + '</h2><p class="lead">' + t().declareSub + '</p><div class="miss-pick">';
    for (var s = 0; s < 3; s++) {
      h += '<div class="mp' + (s === rec ? ' recommend' : '') + '" data-suit="' + s + '">' +
        '<div class="big" style="color:' + SUITS[s].hex + '">' + suitName(s) + '</div>' +
        '<div class="cnt">' + cnt[s] + ' ' + t().count + '</div>' +
        (s === rec ? '<div class="recs">★ ' + t().recommend + '</div>' : '') + '</div>';
    }
    h += '</div><div class="rowlbl" style="margin-top:14px">' + t().hand + '</div><div class="tiles">' +
      CM.concealedTiles(my).map(function (id) { return tileHTML(id, { cls: 'click' }); }).join('') + '</div></div>';
    return h;
  }

  function resultModal() {
    var g = state.g, S = g.settlement, rows = '';
    var order = [0, 1, 2, 3].slice().sort(function (a, b) {
      return (S ? S.seats[b].net : 0) - (S ? S.seats[a].net : 0);
    });
    for (var i = 0; i < SEATS.length; i++) {
      var s = order[i], p = g.players[s];
      var st = p.won ? t().stWon + ' ' + p.winInfo.fans.total + ' 番' : (g.readyAtEnd[s] ? t().stReady : t().stNot);
      var net = S ? S.seats[s].net : 0;
      var parts = [];
      if (S) {
        var x = S.seats[s];
        if (x.fanPoints) parts.push(t().detailFan + ' +' + x.fanPoints);
        if (x.kongIn) parts.push(t().detailKong + ' +' + x.kongIn);
        if (x.kongOut) parts.push(t().detailKong + ' −' + x.kongOut);
        if (x.readyIn) parts.push(t().detailReady + ' +' + x.readyIn);
        if (x.readyOut) parts.push(t().detailReady + ' −' + x.readyOut);
        if (x.flowerPigOut) parts.push(t().detailPig + ' −' + x.flowerPigOut);
        if (x.refundIn) parts.push(t().detailRefund + ' +' + x.refundIn);
        if (x.refundOut) parts.push(t().detailRefund + ' −' + x.refundOut);
      }
      // 中国习惯：正分红、负分绿
      var col = net > 0 ? '#c0392b' : net < 0 ? '#1c7d4d' : '#5b6470';
      rows += '<tr class="' + (s === HUMAN ? 'me' : '') + '"><td>' + seatName(s) + '</td><td>' + st + '</td>' +
        '<td>' + (p.winInfo ? CM.tileLabel(p.winInfo.tile) : '—') + '</td>' +
        '<td style="font-weight:800;color:' + col + '">' + (net > 0 ? '+' : '') + net + '</td>' +
        '<td class="fanlist">' + (parts.join('　') || (p.winInfo ? p.winInfo.fans.items.map(function (it) { return it.name + '(' + it.fans + ')'; }).join(' ') : '—')) + '</td></tr>';
    }
    var myNet = S ? S.seats[HUMAN].net : 0;
    return '<div class="modal"><h2>' + t().settled + ' — ' + (g.winCount >= 3 ? t().reasonThree : t().reasonWall) +
      '　|　' + t().you + ' ' + (myNet > 0 ? '+' : '') + myNet + '</h2>' +
      '<table class="res-table"><thead><tr><th>' + t().seatRes + '</th><th>' + t().status + '</th><th>' + t().handTile + '</th><th>' + t().colNet + '</th><th>' + t().colDetail + '</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div style="margin-top:8px;font-size:12px;color:#5b6470">' + t().scoreNote + '</div>' +
      '<div style="margin-top:14px;display:flex;gap:10px"><button class="btn pri" id="againBtn">' + t().again + '</button><button class="btn" id="closeRes">' + t().close + '</button></div></div>';
  }

  function helpModal() {
    return '<div class="modal"><h2>' + t().helpTitle + '</h2><div class="legendbox">' + t().helpBody + '</div>' +
      '<div style="margin-top:16px"><button class="btn" id="helpClose">' + t().close + '</button></div></div>';
  }

  function renderOverlay() {
    var g = state.g, ov = document.getElementById('overlay');
    var content = null;
    if (state.overlay === 'help') content = helpModal();
    else if (state.overlay === 'result') content = resultModal();
    else if (g.phase === 'finished') content = resultModal();
    else if (g.phase === 'declareMissing' && g.players[HUMAN].missing === -1) content = declareModal();
    if (!content) { ov.className = 'overlay'; ov.innerHTML = ''; return; }
    ov.className = 'overlay show';
    ov.innerHTML = content;
    ov.querySelectorAll('.mp').forEach(function (el) { el.onclick = function () { humanDeclare(+el.dataset.suit); }; });
    var ag = document.getElementById('againBtn'); if (ag) ag.onclick = newGame;
    var hc = document.getElementById('helpClose'); if (hc) hc.onclick = function () { state.overlay = null; render(); };
    var cr = document.getElementById('closeRes'); if (cr) cr.onclick = function () { state.overlay = 'none'; render(); };
  }

  function renderLog() {
    state.logLines = state.logLines.concat(logNewEvents());
    if (state.logLines.length > 150) state.logLines = state.logLines.slice(-150);
    var el = document.getElementById('log');
    if (el) {
      el.innerHTML = state.logLines.map(function (l, i) { return '<div><span class="n">' + (i + 1) + '</span>' + l + '</div>'; }).join('');
      el.scrollTop = el.scrollHeight;
    }
    var cap = document.getElementById('logcap'); if (cap) cap.textContent = t().logcap;
  }

  function render() {
    var g = state.g;
    document.getElementById('ttl').textContent = t().title;
    document.getElementById('helpBtn').textContent = t().help;
    document.getElementById('demoBtn').textContent = state.demo ? t().demoStop : t().demo;
    document.getElementById('newBtn').textContent = t().newGame;
    document.getElementById('langBtn').textContent = t().lang;
    var dl = document.getElementById('diffLbl');
    if (dl) {
      dl.textContent = t().diffLbl;
      var dtx = { easy: t().dEasy, normal: t().dNormal, hard: t().dHard };
      document.querySelectorAll('#diffs .dbtn').forEach(function (b) {
        b.textContent = dtx[b.dataset.d];
        b.className = 'dbtn' + (b.dataset.d === state.diff ? ' on' : '');
      });
    }
    document.getElementById('hstat').innerHTML =
      '<span>' + t().wall + ' <b>' + g.wall.length + '</b></span>' +
      '<span>' + t().turn + ' <b class="turnlbl">' + (g.phase === 'playing' ? seatName(g.turn) : '—') + '</b></span>' +
      '<span>' + t().dealerTag + ' <b>' + seatName(g.dealer) + '</b></span>' +
      (g.settlement ? '<span>' + t().colNet + ' <b>' + (g.settlement.seats[HUMAN].net > 0 ? '+' : '') + g.settlement.seats[HUMAN].net + '</b></span>' : '') +
      (state.demo ? '<span>' + t().demoOn + '</span>' : '');

    document.getElementById('board').innerHTML =
      panelHTML(2) + panelHTML(3) + centerHTML() + panelHTML(1) + panelHTML(0);

    renderHand();
    renderActions();
    renderOverlay();
    renderLog();
  }

  /* ---------------- 演示模式 ---------------- */
  function toggleDemo() {
    if (state.demo) { state.demo = false; if (state.timer) { clearInterval(state.timer); state.timer = null; } render(); return; }
    state.overlay = null;
    state.demo = true;
    state.timer = setInterval(function () {
      if (!state.g || state.g.phase === 'finished') { clearInterval(state.timer); state.timer = null; state.demo = false; render(); return; }
      pump(); render();
    }, 350);
    render();
  }

  /* ---------------- 事件 ---------------- */
  document.getElementById('newBtn').onclick = function () { newGame(); };
  document.getElementById('demoBtn').onclick = toggleDemo;
  document.getElementById('helpBtn').onclick = function () { state.overlay = state.overlay === 'help' ? null : 'help'; render(); };
  document.getElementById('langBtn').onclick = function () { state.lang = state.lang === 'zh' ? 'en' : 'zh'; render(); };
  document.querySelectorAll('#diffs .dbtn').forEach(function (b) {
    b.onclick = function () { state.diff = b.dataset.d; render(); };
  });

  newGame();
})();
</script>
</body>
</html>
