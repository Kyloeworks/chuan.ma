<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>川麻 2.5D · 血战到底 · Chuanma GPU Table</title>
<style>
  :root{
    --bg:#0f1418;--card:#fff;--ink:#1a1d21;--sub:#5b6470;--line:#dfe3e9;
    --accent:#1f6feb;--gold:#c9971f;--felt:#2f6b4f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --k:1;   /* UI 缩放档：由 JS 按视口大小设置（xs/sm/md/lg/xl/xxl/4k 七档） */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}   /* 满屏：永不出现页面滚动条 */
  body{background:#0f1418;color:var(--ink);font-size:calc(14px * var(--k));line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .app{height:100%;display:flex;flex-direction:column;overflow:hidden}
  header{flex:0 0 auto;display:flex;align-items:center;gap:calc(14px * var(--k));
    padding:calc(8px * var(--k)) calc(16px * var(--k));background:#161c22;color:#e9edf2;
    border-bottom:1px solid #232b33;min-height:0}
  h1{font-size:calc(16px * var(--k));margin:0;white-space:nowrap;color:#fff}
  .hstat{display:flex;gap:calc(14px * var(--k));align-items:center;font-size:calc(13px * var(--k));
    color:#93a1b0;white-space:nowrap;overflow:hidden}
  .hstat b{color:#fff;font-variant-numeric:tabular-nums}
  .diag{font-size:calc(11.5px * var(--k));font-family:var(--mono);padding:calc(2px * var(--k)) calc(9px * var(--k));
    border-radius:20px;background:#232b33;color:#93a1b0;white-space:nowrap;
    max-width:calc(240px * var(--k));overflow:hidden;text-overflow:ellipsis}
  .diag[data-status=ok]{background:#14351f;color:#7fd8a5}
  .diag[data-status=fail]{background:#3b1717;color:#f19a90}
  .spacer{flex:1;min-width:0}
  .diffs{display:flex;align-items:center;gap:calc(6px * var(--k));padding:calc(2px * var(--k)) calc(8px * var(--k));
    border-radius:20px;background:#1b2229;white-space:nowrap}
  .dlbl{font-size:calc(11.5px * var(--k));color:#6b7784}
  .dbtn{border:1px solid transparent;background:transparent;color:#93a1b0;font-size:calc(12px * var(--k));
    padding:calc(3px * var(--k)) calc(10px * var(--k));border-radius:14px;cursor:pointer;font-weight:600}
  .dbtn:hover{color:#cfe0f0}
  .dbtn.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
  .dbtn.on[data-d=easy]{background:#0f6e56;border-color:#0f6e56}
  .dbtn.on[data-d=hard]{background:#a32d2d;border-color:#a32d2d}
  .res-table tr.me td{background:#f6f9ff}
  .res-table tr.me td:first-child{font-weight:800}
  .btn{border:1px solid #2c353f;background:#1b2229;border-radius:calc(9px * var(--k));
    padding:calc(5px * var(--k)) calc(12px * var(--k));font-size:calc(12.5px * var(--k));
    cursor:pointer;color:#dfe6ee;font-weight:600;white-space:nowrap}
  .btn:hover{border-color:#4b9bff;color:#8ec2ff}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.pri:hover{background:#1a5fd0;color:#fff}
  a.btn{text-decoration:none;display:inline-block;color:#dfe6ee}
  /* 桌面动作按钮（胡 / 碰 / 杠 / 过）：随档放大，胡牌额外强调 */
  #actions{display:flex;gap:calc(14px * var(--k));justify-content:center;align-items:center}
  #actions .btn{font-size:calc(20px * var(--k));font-weight:900;letter-spacing:.08em;
    padding:calc(13px * var(--k)) calc(34px * var(--k));border-radius:calc(14px * var(--k));
    min-width:calc(104px * var(--k));border-width:2px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #actions .btn.pri{background:linear-gradient(180deg,#3d8ef8,#1a5fd0);border-color:#7ab2ff}
  #actions .btn.hu{font-size:calc(27px * var(--k));min-width:calc(140px * var(--k));
    padding:calc(13px * var(--k)) calc(42px * var(--k));color:#3a2600;
    background:linear-gradient(180deg,#ffdd72,#e0a418);border-color:#fff3c4;
    animation:hupulse 1s ease-in-out infinite}
  @keyframes hupulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  /* 牌桌：吃满剩余高度，绝不给页面留滚动条 */
  .stage{flex:1 1 auto;min-height:0;position:relative;background:#0b2a1c;overflow:hidden}
  .stage canvas{display:block;position:absolute;inset:0}
  /* 对局记录：浮动抽屉（不再占用牌桌高度） */
  .drawer{position:fixed;right:0;bottom:0;z-index:15;display:flex;flex-direction:column;
    align-items:flex-end;gap:calc(8px * var(--k));padding:0 calc(12px * var(--k)) calc(12px * var(--k)) 0}
  .drawer .panel{display:none;width:min(calc(560px * var(--k)),44vw);max-height:44vh;overflow:auto;
    background:rgba(14,20,26,.95);border:1px solid #2b343d;border-radius:calc(12px * var(--k));
    padding:calc(10px * var(--k)) calc(12px * var(--k));color:#c3cdd8;
    box-shadow:0 14px 40px rgba(0,0,0,.55);font-size:calc(12.5px * var(--k))}
  .drawer.open .panel{display:block}
  .drawer .panel .logcap{font-size:calc(10.5px * var(--k));font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:#6b7784;margin-bottom:calc(6px * var(--k))}
  .log .n{color:#6b7784;font-family:var(--mono);font-size:calc(11px * var(--k));margin-right:6px}
  .log div{padding:1px 0}
  .overlay{position:fixed;inset:0;background:rgba(8,12,16,.72);display:none;align-items:center;
    justify-content:center;padding:calc(20px * var(--k));z-index:20}
  .overlay.show{display:flex}
  .modal{background:var(--card);border-radius:calc(16px * var(--k));padding:calc(22px * var(--k)) calc(24px * var(--k));
    max-width:min(calc(760px * var(--k)),94vw);width:100%;max-height:92vh;overflow:auto;
    box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .modal h2{font-size:calc(18px * var(--k));margin:0 0 calc(6px * var(--k))}
  .modal .lead{color:var(--sub);font-size:calc(13.5px * var(--k));margin:0 0 calc(14px * var(--k))}
  .miss-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(12px * var(--k))}
  .mp{border:2px solid var(--line);border-radius:calc(12px * var(--k));padding:calc(14px * var(--k));
    text-align:center;cursor:pointer;background:#fff;transition:.12s}
  .mp:hover{border-color:var(--accent);transform:translateY(-2px)}
  .mp .big{font-size:calc(28px * var(--k));font-weight:900}
  .mp .cnt{font-size:calc(13px * var(--k));color:var(--sub);margin-top:calc(4px * var(--k))}
  .mp .recs{font-size:calc(11.5px * var(--k));font-weight:800;color:var(--gold);margin-top:calc(5px * var(--k))}
  .mp.recommend{border-color:var(--gold);background:#fffdf6}
  .sgroup{margin-top:calc(16px * var(--k))}
  .slbl{font-size:calc(12.5px * var(--k));font-weight:800;color:var(--sub);letter-spacing:.04em;
    margin-bottom:calc(7px * var(--k))}
  .shint{font-size:calc(12px * var(--k));color:var(--sub);margin-top:calc(6px * var(--k))}
  .pills{display:flex;gap:calc(8px * var(--k));flex-wrap:wrap}
  .pill{border:1px solid var(--line);background:#fff;color:#3a4149;font-size:calc(13px * var(--k));
    font-weight:700;padding:calc(7px * var(--k)) calc(14px * var(--k));border-radius:calc(10px * var(--k));
    cursor:pointer;transition:.14s}
  .pill:hover{border-color:var(--accent);color:var(--accent)}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .res-table{width:100%;border-collapse:collapse;font-size:calc(13.5px * var(--k));margin-top:calc(10px * var(--k))}
  .res-table th,.res-table td{padding:calc(7px * var(--k)) calc(9px * var(--k));
    border-bottom:1px solid var(--line);text-align:left}
  .res-table th{font-size:calc(11.5px * var(--k));color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
  .legendbox{font-size:calc(13px * var(--k));color:#3a4149;line-height:1.9}
  .fallback{padding:16px;color:#e9edf2}
  .fallback code{font-family:var(--mono);font-size:12px;background:#232b33;padding:2px 6px;border-radius:5px}
  /* 窄窗口优先保牌桌：先隐藏技术诊断，再隐藏标题 */
  @media (max-width:1180px){ .diag{display:none} }
  @media (max-width:1000px){ h1{display:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="btn" id="homeBtn" href="index.html" title="chuan.ma">&#8592; chuan.ma</a>
    <h1 id="ttl"></h1>
    <div class="hstat" id="hstat"></div>
    <span class="diag" id="diag" data-status="init">PixiJS 初始化中…</span>
    <div class="spacer"></div>
    <div class="diffs" id="diffs">
      <span class="dlbl" id="diffLbl"></span>
      <button class="dbtn" data-d="easy"></button>
      <button class="dbtn" data-d="normal"></button>
      <button class="dbtn" data-d="hard"></button>
    </div>
    <button class="btn" id="helpBtn"></button>
    <button class="btn" id="demoBtn"></button>
    <button class="btn" id="newBtn"></button>
    <button class="btn" id="langBtn">EN</button>
  </header>
  <div class="stage" id="stage"></div>
</div>
<div class="drawer" id="drawer">
  <button class="btn" id="logBtn"></button>
  <div class="panel">
    <div class="logcap" id="logcap"></div>
    <div class="log" id="log"></div>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<script>/*__KERNEL__*/</script>
<script>/*__PIXI__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
