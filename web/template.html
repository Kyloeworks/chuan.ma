<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>川麻算牌器 · Chuanma Mahjong Hand Calculator</title>
<style>
  /* 设计令牌集中维护在 tokens.js，由 build.mjs 在此展开 :root{...} —— 色值不要硬写 */
  /*__TOKENS_CSS__*/
  :root{
    /* 本页专属：结果语义色（仅算牌器使用，不进全局令牌） */
    --accent-soft:#eef4fd;
    --good:#1e8e5a; --goodbg:#eef8f2; --warn:#b7791f; --warnbg:#fdf6e8;
  }
  /* 字号 / 间距 / 圆角 / 边框 / 行高 一律引用 --fs-* --sp-* --r-* --bw-* --lh-*，
     尺度定义在 tokens.js。工具页正文用 --fs-ui（密度优先），不与阅读页争尺寸。 */
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-size:var(--fs-ui);line-height:var(--lh-ui);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-size-adjust:100%}
  img,svg,table{max-width:100%}
  .wrap{max-width:1000px;margin:0 auto;padding:var(--sp-xxl) var(--sp-xl) var(--sp-5xl)}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-lg);
    border-bottom:var(--bw-rule) solid var(--ink);padding-bottom:var(--sp-md);
    margin-bottom:var(--sp-xl);flex-wrap:wrap}
  h1{font-size:var(--fs-h1);line-height:var(--lh-tight);margin:0 0 var(--sp-xs);letter-spacing:-.01em}
  .sub{color:var(--sub);font-size:var(--fs-small)}
  .lang{border:var(--bw-hair) solid var(--line);background:var(--card);border-radius:var(--r-full);
    padding:0 var(--sp-lg);min-height:var(--sp-3xl);display:inline-flex;align-items:center;
    font-size:var(--fs-small);cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none}
  .lang:hover{border-color:var(--accent);color:var(--accent)}
  .cols{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--sp-lg);align-items:start}
  /* grid 项默认 min-width:auto＝min-content，内部有 9 列固定宽度的网格时
     会把整列顶宽、进而把**整页**撑出横向滚动条（实测 375px 视口被撑到 409px）。
     min-width:0 让列可以收缩到容器宽度，内部需要更宽的内容自己在容器里滚动。 */
  .cols>div{min-width:0}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .card{background:var(--card);border:var(--bw-hair) solid var(--line);border-radius:var(--r-md);
    padding:var(--sp-lg);margin-bottom:var(--sp-lg)}
  .card h2{font-size:var(--fs-small);margin:0 0 var(--sp-md);color:#3a4149;letter-spacing:.02em;
    text-transform:uppercase;font-weight:700}
  .suitrow{display:flex;align-items:center;gap:var(--sp-sm);margin-bottom:var(--sp-sm)}
  .suitrow .st{width:22px;font-size:var(--fs-small);font-weight:700;text-align:center;flex:none}
  /* min-width:0 让这一排在窄屏能自己横向滚动，而不是把整页撑宽 */
  .tiles{display:grid;grid-template-columns:repeat(9,1fr);gap:var(--sp-xs);flex:1;min-width:0}
  .tb{position:relative;height:52px;border:var(--bw-hair) solid var(--line);border-radius:var(--r-sm);
    background:#fbfcfd;cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:var(--sp-hair);transition:.12s;user-select:none}
  .tb:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08)}
  .tb:active{transform:translateY(0)}
  .tb .tf{display:block;width:34px;height:47px;line-height:0}
  .tb .tf svg{display:block;width:100%;height:100%}
  .tb.on{background:#fff;border-color:currentColor;box-shadow:inset 0 0 0 1.5px currentColor}
  .tb .n{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;border-radius:var(--r-full);
    background:var(--ink);color:#fff;font-size:var(--fs-meta);line-height:17px;text-align:center;padding:0 var(--sp-xs)}
  .controls{display:flex;gap:var(--sp-lg);flex-wrap:wrap;align-items:center;margin-top:var(--sp-xs)}
  .ctrl{display:flex;align-items:center;gap:var(--sp-sm);font-size:var(--fs-small)}
  select{border:var(--bw-hair) solid var(--line);border-radius:var(--r-sm);
    padding:var(--sp-xs) var(--sp-sm);min-height:var(--sp-3xl);font-size:var(--fs-small);
    background:#fff;color:var(--ink);font-family:inherit}
  .btn{border:var(--bw-hair) solid var(--line);background:#fff;border-radius:var(--r-sm);
    padding:0 var(--sp-md);min-height:var(--sp-3xl);display:inline-flex;align-items:center;
    font-size:var(--fs-small);cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.gh{cursor:default;border-style:dashed;color:var(--sub);font-size:var(--fs-meta)}
  .hint{font-size:var(--fs-meta);color:var(--sub);margin-top:var(--sp-sm);line-height:var(--lh-ui)}
  /* results */
  .big{display:flex;align-items:baseline;gap:var(--sp-md);margin-bottom:var(--sp-xs);flex-wrap:wrap}
  .bignum{font-size:var(--fs-num);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .bignum.z{color:var(--good)} .bignum.win{color:var(--accent)} .bignum.neg{color:var(--good)}
  .biglbl{font-size:var(--fs-ui);font-weight:600;color:var(--sub)}
  .explain{font-size:var(--fs-dense);color:#333;margin:var(--sp-hair) 0 0;line-height:var(--lh-ui)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--sp-sm);margin-top:var(--sp-sm)}
  .chip{display:inline-flex;align-items:center;gap:var(--sp-xs);border:var(--bw-hair) solid currentColor;
    border-radius:var(--r-sm);padding:var(--sp-xs) var(--sp-sm);font-weight:700;
    font-size:var(--fs-dense);background:#fff}
  .chip .mini{display:inline-block;width:15px;height:21px;line-height:0}
  .chip .mini svg{display:block;width:100%;height:100%}
  .chip em{font-style:normal;font-size:var(--fs-meta);opacity:.7;font-weight:600}
  .chip.big{border-color:var(--good);color:var(--good);background:var(--goodbg)}
  .sec-t{font-size:var(--fs-meta);font-weight:700;color:var(--sub);margin:var(--sp-lg) 0 var(--sp-sm);
    text-transform:uppercase;letter-spacing:.03em}
  table{width:100%;border-collapse:collapse;font-size:var(--fs-dense)}
  th,td{padding:var(--sp-sm) var(--sp-sm);text-align:left;border-bottom:var(--bw-hair) solid var(--line)}
  th{font-size:var(--fs-meta);color:var(--sub);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  tr.best td{background:var(--goodbg)}
  tr.best td:first-child{font-weight:800}
  td.num{font-variant-numeric:tabular-nums}
  .note{border-radius:var(--r-md);padding:var(--sp-md);font-size:var(--fs-dense);
    margin-top:var(--sp-md);border:var(--bw-hair) solid;line-height:var(--lh-ui)}
  .note.warn{background:var(--warnbg);border-color:#f0dcae;color:#7a5310}
  .note.ok{background:var(--goodbg);border-color:#c3e6d2;color:#166b45}
  .note.info{background:var(--accent-soft);border-color:#cddff8;color:#1b4f9c}
  .empty{color:var(--sub);font-size:var(--fs-dense);padding:var(--sp-sm) 0}
  .handline{font-family:var(--mono);font-size:var(--fs-small);color:var(--sub);
    margin-top:var(--sp-sm);word-break:break-all;line-height:var(--lh-ui)}
  footer{margin-top:var(--sp-xxl);color:var(--sub);font-size:var(--fs-meta);text-align:center}
  .ex{display:flex;gap:var(--sp-sm);flex-wrap:wrap;margin-top:var(--sp-sm)}

  /* 窄屏：9 列牌位放不下时让这一排**自己**横向滚动（而不是把整页撑宽）。
     此前实测 375px 视口被撑到 494px，整页出现横向滚动条。 */
  @media(max-width:520px){
    .wrap{padding:var(--sp-lg) var(--sp-lg) var(--sp-4xl)}
    .card{padding:var(--sp-md)}
    .suitrow{min-width:0}
    .tiles{grid-template-columns:repeat(9,30px);overflow-x:auto;padding-bottom:var(--sp-xs);
      scrollbar-width:thin}
    .tb{height:42px}
    .tb .tf{width:26px;height:36px}
    .suitrow .st{width:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="ttl">川麻算牌器</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div style="display:flex;gap:var(--sp-sm);align-items:center">
      <a class="lang" href="index.html" title="chuan.ma">Chuan.Ma · 川麻</a>
      <button class="lang" id="langBtn">EN</button>
    </div>
  </header>
  <div class="cols">
    <div>
      <div class="card">
        <h2 id="h-hand"></h2>
        <div id="picker"></div>
        <div class="controls" id="controls"></div>
        <div class="handline" id="handline"></div>
        <div class="ex" id="examples"></div>
      </div>
    </div>
    <div>
      <div class="card" id="result"></div>
    </div>
  </div>
  <footer id="foot"></footer>
</div>
<script>/*__KERNEL__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
